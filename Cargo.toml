[workspace]
members = ["crates/runloom-core", "crates/runloom-cli", "crates/runloom-node", "crates/runloom-checkpoint"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"

fs2 = "0.4"
libc = "0.2"

portable-pty = "0.9"
sha2 = "0.11.1"
