name: Draft alpha release
on:
  push:
    tags: ['v*-alpha.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py --tag "$RELEASE_TAG"
      - run: python3 scripts/smoke-release.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Create draft only (never overwrite a release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease \
            --title "Runloom $RELEASE_TAG" --notes-file docs/RELEASE.md
